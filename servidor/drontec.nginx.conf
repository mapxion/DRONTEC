# EJEMPLO HTTP: integrar con la configuración existente del VPS.
# La configuración HTTPS y certificados se completará en el servidor real.
server {
    listen 80;
    listen [::]:80;
    server_name drontec.es www.drontec.es;
    root /var/www/drontec;
    index index.html;

    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(jpg|jpeg|png|webp|svg|css|js)$ {
        expires 7d;
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
